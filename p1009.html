<title>窮子喻動畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&display=swap">
<style>
/* Layout: a 9:16 whiteboard stage on a dark page; story-style progress bars on top, tap to move between scenes.
   Palette: paper, ink, gold, red, blue marker, warm browns. Type: Noto Sans TC. */
:root {
  --page: #17140f;
  --page-fg: #e9e2d2;
  --paper: #f3ecdd;
  --ink: #2a2521;
  --red: #d8392b;
  --gold: #e9b630;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
body {
  background: var(--page);
  color: var(--page-fg);
  font-family: var(--font);
  padding-inline: 16px;
  padding-block: 20px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.stage {
  container-type: inline-size;
  position: relative;
  width: min(100%, 400px);
  aspect-ratio: 3 / 4;
  background: var(--paper);
  overflow: hidden;
  border-radius: 6px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.lbl { font-family: var(--font); font-weight: 900; }

.segs { position: absolute; top: 2.2cqw; left: 3cqw; right: 3cqw; display: flex; gap: 1.2cqw; z-index: 3; }
.seg { flex: 1; height: 3px; background: rgba(42, 37, 33, .22); border-radius: 2px; overflow: hidden; }
.seg i { display: block; height: 100%; width: 0; background: var(--ink); }
.seg.done i { width: 100%; }
.seg.cur i { animation: seg var(--dur, 6s) linear both; }

.head { position: absolute; top: 6cqw; left: 4.5cqw; z-index: 3; color: var(--ink); line-height: 1.1; pointer-events: none; }
.head small { display: block; font-size: 3cqw; font-weight: 500; letter-spacing: .4em; opacity: .7; }
.head b { font-size: 6.2cqw; font-weight: 900; letter-spacing: .12em; }

.cap {
  position: absolute;
  left: 0; right: 0; bottom: 3%;
  padding-inline: 5cqw;
  text-align: center;
  font-weight: 900;
  font-size: 4.1cqw;
  line-height: 1.3;
  color: #fff;
  -webkit-text-stroke: 1.3cqw #000;
  paint-order: stroke fill;
  text-wrap: balance;
  display: flex; align-items: flex-end; justify-content: center;
  min-height: 4em;
  pointer-events: none;
  z-index: 2;
}
.cap span { display: block; animation: capin .3s ease-out both; }

/* ---- animation helpers (scenes are display:none until active, so each start restarts them) ---- */
.draw { stroke-dasharray: var(--len, 1); animation: draw calc(var(--dur, .6s) * var(--kd, 1)) ease-out var(--d, 0s) both; }
.pop { animation: pop calc(.5s * var(--kp, 1)) cubic-bezier(.2, 1.5, .4, 1) var(--d, 0s) both; }
.fillin { animation: fillin calc(.6s * var(--kf, 1)) ease-out var(--d, 0s) both; }
.twink { transform-box: fill-box; transform-origin: center; animation: twink 1.5s ease-in-out var(--d, 0s) infinite both; }
.floatup { animation: floatup 3s ease-out var(--d, 0s) infinite both; }
.fall { transform-box: fill-box; transform-origin: center; animation: fall 5.5s linear var(--d, 0s) infinite both; }
.rain { animation: rain 1.1s linear var(--d, 0s) infinite both; }
.dust { animation: dust 3.6s ease-in-out var(--d, 0s) infinite both; }
.recoil { animation: recoil 1.6s ease-out var(--d, 0s) both; }
.stroll { animation: stroll calc(6.2s * var(--k, 1)) linear .2s both; }
.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow calc(6.2s * var(--k, 1)) ease-in-out both; }
.sunrise { animation: sunrise calc(5s * var(--k, 1)) ease-out .3s both; }
.wob { transform-box: fill-box; transform-origin: 50% 100%; animation: wob 2.4s ease-in-out var(--d, 0s) infinite both; }

@keyframes draw { from { stroke-dashoffset: var(--len, 1); } to { stroke-dashoffset: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes fillin { from { opacity: 0; } to { opacity: 1; } }
@keyframes twink { 0%, 100% { opacity: .25; transform: scale(.5) rotate(0deg); } 50% { opacity: 1; transform: scale(1.15) rotate(20deg); } }
@keyframes floatup { 0% { opacity: 0; transform: translateY(0); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-52px); } }
@keyframes fall { 0% { opacity: 0; transform: translate(0, -10px) rotate(0deg); } 10% { opacity: .95; } 100% { opacity: .9; transform: translate(var(--dx, 24px), 360px) rotate(220deg); } }
@keyframes rain { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(26px); } }
@keyframes dust { 0%, 100% { opacity: 0; transform: translate(0, 0); } 50% { opacity: .8; transform: translate(18px, -14px); } }
@keyframes recoil {
  0% { transform: translateX(0); } 8% { transform: translateX(7px); } 16% { transform: translateX(-6px); }
  24% { transform: translateX(6px); } 32% { transform: translateX(-5px); } 40% { transform: translateX(-9px); }
  100% { transform: translateX(-16px); }
}
@keyframes stroll { from { transform: translate(0, 0); } to { transform: translate(86px, -34px); } }
@keyframes grow { from { transform: scale(.82); } to { transform: scale(1.14); } }
@keyframes sunrise { from { transform: translateY(46px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes wob { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
@keyframes capin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes seg { from { width: 0; } to { width: 100%; } }

.head { transition: opacity .6s; }
.stage.pre .head { opacity: 0; }
.stage.nohead .head { opacity: 0; }
.intro {
  position: absolute; inset: 0; z-index: 4;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4cqw;
  color: var(--ink); text-align: center;
  transition: opacity .9s;
}
.intro small { font-size: 4cqw; font-weight: 500; letter-spacing: .5em; opacity: .7; }
.intro b { font-size: 17cqw; font-weight: 900; letter-spacing: .14em; line-height: 1; }
.intro .startbtns { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 10cqw; }
.intro .startbtns button { font-size: 16px; padding: 14px 30px; }
.intro .startbtns button.sub { background: transparent; color: var(--ink); text-decoration: underline; padding: 6px 10px; font-size: 14px; font-weight: 500; }
.intro.run { pointer-events: none; }
.intro.run .startbtns { display: none; }
.intro.out { opacity: 0; }
.scene.enter { animation: sceneIn .6s ease both; }
.scene.leave { animation: sceneOut .6s ease both; }
@keyframes sceneIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sceneOut { from { opacity: 1; } to { opacity: 0; } }
.beat-a { animation: beatout .6s ease var(--out, 0s) both; }
.beat-b { animation: beatin .6s ease var(--in, 0s) both; }
.go { animation: go 2.6s ease-in-out var(--d, 0s) both; }
.beat { transform-box: fill-box; transform-origin: center; animation: heartbeat 1.3s ease-in-out var(--d, 0s) infinite both; }
@keyframes beatout { from { opacity: 1; } to { opacity: 0; } }
@keyframes beatin { from { opacity: 0; } to { opacity: 1; } }
@keyframes go { from { transform: translate(0, 0); } to { transform: translate(var(--gx, 0px), var(--gy, 0px)); } }
@keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
.again { position: absolute; left: 0; right: 0; bottom: 1.6%; text-align: center; font-size: 3.4cqw; font-weight: 500; color: var(--ink); opacity: 0; z-index: 3; pointer-events: none; transition: opacity .8s; }
.again.show { opacity: .65; }
#art.measuring * { animation: none !important; }
.stage.paused * { animation-play-state: paused !important; }

.ctrl { display: none; }
button {
  font: 900 14px/1 var(--font);
  color: var(--ink);
  background: var(--paper);
  border: 0;
  border-radius: 999px;
  padding: 12px 18px;
  cursor: pointer;
}
.note { margin: 0; font-size: 13px; line-height: 1.5; text-align: center; opacity: .75; max-width: 400px; }
button:focus-visible { outline: 3px solid #6aa0ff; outline-offset: 3px; }
button.hot { background: var(--gold); }
</style>

<div class="stage pre" id="stage">
  <svg id="svg" viewBox="0 64 360 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="窮子喻手繪動畫">
    <defs>
      <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="1" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="paper" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2"/>
        <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.28  0 0 0 0.9 -0.35"/>
      </filter>
    </defs>
    <rect width="360" height="640" fill="#f3ecdd"/>
    <rect width="360" height="640" filter="url(#paper)" opacity="0.32"/>
    <g id="art" filter="url(#rough)"></g>
  </svg>
  <div class="segs" id="segs"></div>
  <div class="head"><small>法華七喻之</small><b>窮子喻</b></div>
  <div class="cap" id="cap" aria-live="polite"></div>
  <div class="again" id="again">點一下重新播放</div>
  <div class="intro" id="intro">
    <small>法華七喻之</small>
    <b>窮子喻</b>
    <div class="startbtns">
      <button id="bStart" type="button" class="hot">▶ 開始播放</button>
    </div>
  </div>
</div>


<script>
(function () {
  var INK = '#2a2521', SKIN = '#f6dcbc', GOLD = '#e9b630';

  /* ---------- drawing helpers (return SVG strings) ---------- */
  function L(d, del, dur, o) {
    o = o || {};
    return '<path class="draw" pathLength="1" d="' + d + '" fill="none" stroke="' + (o.c || INK) +
      '" stroke-width="' + (o.w || 3) + '" stroke-linecap="round" stroke-linejoin="round" style="--d:' + del + 's;--dur:' + (dur || 0.6) + 's"/>';
  }
  function F(d, fill, del, op) {
    return '<path class="fillin" d="' + d + '" fill="' + fill + '" fill-opacity="' + (op == null ? 1 : op) + '" style="--d:' + del + 's"/>';
  }
  function T(txt, x, y, sz, fill, del, anchor) {
    return '<text class="lbl pop" x="' + x + '" y="' + y + '" font-size="' + sz + '" fill="' + fill +
      '" text-anchor="' + (anchor || 'middle') + '" style="--d:' + del + 's">' + txt + '</text>';
  }
  function C(x, y, r, fill, del, cls) {
    return '<circle class="' + (cls || 'pop') + '" cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + fill +
      '" stroke="' + INK + '" stroke-width="2" style="--d:' + del + 's"/>';
  }
  function star(x, y, r, del) {
    var k = r * 0.28;
    return '<path class="twink" d="M' + x + ' ' + (y - r) + ' L' + (x + k) + ' ' + (y - k) + ' L' + (x + r) + ' ' + y +
      ' L' + (x + k) + ' ' + (y + k) + ' L' + x + ' ' + (y + r) + ' L' + (x - k) + ' ' + (y + k) + ' L' + (x - r) + ' ' + y +
      ' L' + (x - k) + ' ' + (y - k) + ' Z" fill="#f2b705" stroke="' + INK + '" stroke-width="1.6" stroke-linejoin="round" style="--d:' + del + 's"/>';
  }
  function heart(x, y, del) {
    return '<g transform="translate(' + x + ',' + y + ') scale(.7)"><path class="floatup" d="M0 0 C-8 -10 -22 2 0 18 C22 2 8 -10 0 0 Z" fill="#e0524a" stroke="' + INK +
      '" stroke-width="2.4" stroke-linejoin="round" style="--d:' + del + 's"/></g>';
  }
  /* speech bubble with a tail on the bottom edge: x,y,w,h, tail base x (22 wide), tail tip */
  function bubble(x, y, w, h, bx, tx, ty, del) {
    var r = 16, b = y + h;
    var d = 'M' + (x + r) + ' ' + y + ' H' + (x + w - r) + ' Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + r) +
      ' V' + (b - r) + ' Q' + (x + w) + ' ' + b + ' ' + (x + w - r) + ' ' + b + ' H' + (bx + 22) + ' L' + tx + ' ' + ty +
      ' L' + bx + ' ' + b + ' H' + (x + r) + ' Q' + x + ' ' + b + ' ' + x + ' ' + (b - r) + ' V' + (y + r) +
      ' Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + ' Z';
    return '<g class="pop" style="--d:' + del + 's"><path d="' + d + '" fill="#fffdf7" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/></g>';
  }

  /* ---------- characters (feet at 0,0, fills first, lines on top) ---------- */
  function elder(x, y, s, t, o) {
    o = o || {};
    var a = o.arms || 'open';
    var head = 'M-22 -118 a22 22 0 1 0 44 0 a22 22 0 1 0 -44 0';
    var robe = 'M-24 -96 Q0 -88 24 -96 L40 0 L-40 0 Z';
    var arm = a === 'open' ? 'M-24 -90 L-58 -56 M24 -90 L58 -56' :
              a === 'reach' ? 'M-24 -90 L-76 -70 M24 -90 L42 -52' :
              a === 'hold' ? 'M-24 -90 L-42 -62 L-20 -56 M24 -90 L42 -62 L20 -56' :
              'M-24 -90 L-40 -48 M24 -90 L40 -48';
    var g = '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">';
    g += F(robe, o.robe || '#7a5230', t + 0.5, 0.92);
    g += F('M-10 -94 L0 -68 L10 -94 Z', '#2f4f8f', t + 0.6, 1);
    g += F(head, SKIN, t + 0.75, 1);
    g += F('M-22 -120 Q-22 -142 0 -142 Q22 -142 22 -120 Q10 -130 0 -129 Q-10 -130 -22 -120 Z', '#c4bfb6', t + 0.8, 1);
    g += F('M-15 -108 Q0 -70 15 -108 Q0 -97 -15 -108 Z', '#e1ddd5', t + 0.85, 1);
    g += L(robe, t, 0.7);
    g += L('M-34 -34 Q0 -24 34 -34', t + 0.55, 0.3, { w: 2.4, c: '#c08a14' });
    g += L(arm, t + 0.35, 0.5, { w: 4.5 });
    g += L(head, t + 0.15, 0.6);
    g += L('M-8 -144 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0', t + 0.3, 0.4, { w: 2.4 });
    g += L('M-15 -108 Q0 -70 15 -108', t + 0.5, 0.4, { w: 2.4 });
    g += L('M-12 -121 q4 -5 8 0 M4 -121 q4 -5 8 0', t + 0.9, 0.3, { w: 2.2 });
    g += L('M-6 -106 Q0 -101 6 -106', t + 0.95, 0.2, { w: 2 });
    return g + '</g>';
  }

  function boy(x, y, s, t, o) {
    o = o || {};
    var m = o.mood || 'sad', a = o.arms || 'down', rich = o.outfit === 'rich';
    var body = 'M-15 -70 L-20 -22 L20 -22 L15 -70 Z';
    var arm = a === 'up' ? 'M-15 -66 L-32 -86 M15 -66 L32 -86' :
              a === 'cheeks' ? 'M-15 -66 L-24 -82 L-12 -84 M15 -66 L24 -82 L12 -84' :
              a === 'eat' ? 'M-15 -66 L-30 -44 L-10 -40 M15 -66 L30 -44 L10 -40' :
              'M-15 -66 L-25 -34 M15 -66 L25 -34';
    var g = '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">';
    g += F(body, rich ? '#3b5fb0' : '#a18d6b', t + 0.5, 0.95);
    g += F('M-17 -88 a17 17 0 1 0 34 0 a17 17 0 1 0 -34 0', SKIN, t + 0.6, 1);
    g += F('M-18 -90 Q-16 -110 0 -108 Q16 -110 18 -90 Q9 -99 0 -97 Q-9 -99 -18 -90 Z', '#2a2521', t + 0.65, 1);
    if (!rich) g += F('M-9 -56 h8 v8 h-8 z', '#7d6a4c', t + 0.7, 1);
    g += L(body, t, 0.5);
    g += L(rich ? 'M-15 -70 L0 -58 L15 -70 M-18 -34 H18' : 'M-20 -22 l5 6 l5 -6 l5 6 l5 -6 l5 6 l5 -6 l5 6 l5 -6', t + 0.4, 0.4, { w: 2.2, c: rich ? GOLD : INK });
    g += L('M-8 -22 V0 M8 -22 V0 M-13 0 H-4 M4 0 H13', t + 0.2, 0.4, { w: 3 });
    g += L(arm, t + 0.3, 0.45, { w: 4 });
    g += L('M-17 -88 a17 17 0 1 0 34 0 a17 17 0 1 0 -34 0', t + 0.15, 0.5);
    var e = '';
    if (m === 'happy') {
      e += L('M-10 -89 q4 -5 8 0 M2 -89 q4 -5 8 0', t + 0.9, 0.3, { w: 2.2 });
      e += L('M-7 -81 Q0 -72 7 -81 Z', t + 1.0, 0.3, { w: 2.2 });
    } else {
      e += C(-6, -88, 2.2, INK, t + 0.9).replace('stroke-width="2"', 'stroke-width="1"');
      e += C(6, -88, 2.2, INK, t + 0.9).replace('stroke-width="2"', 'stroke-width="1"');
      if (m === 'sad') {
        e += L('M-11 -95 L-4 -92 M11 -95 L4 -92', t + 1, 0.25, { w: 2 });
        e += L('M-5 -78 Q0 -83 5 -78', t + 1, 0.25, { w: 2.2 });
      } else if (m === 'scared') {
        e += L('M-11 -92 L-4 -96 M11 -92 L4 -96', t + 1, 0.25, { w: 2 });
        e += L('M-4 -80 a4 5 0 1 0 8 0 a4 5 0 1 0 -8 0', t + 1, 0.3, { w: 2.2 });
        e += '<path class="rain" d="M24 -98 q-5 9 0 12 q5 -3 0 -12 Z" fill="#7db4e8" stroke="' + INK + '" stroke-width="1.6" style="--d:' + (t + 1.6) + 's"/>';
      } else if (m === 'amazed') {
        e += L('M-12 -97 q6 -5 11 -1 M12 -97 q-6 -5 -11 -1', t + 1, 0.25, { w: 2 });
        e += L('M-5 -80 a5 6 0 1 0 10 0 a5 6 0 1 0 -10 0', t + 1, 0.3, { w: 2.2 });
        e += '<path class="rain" d="M-26 -94 q-5 9 0 12 q5 -3 0 -12 Z" fill="#7db4e8" stroke="' + INK + '" stroke-width="1.6" style="--d:' + (t + 1.6) + 's"/>';
      } else {
        e += L('M-4 -79 H4', t + 1, 0.2, { w: 2.2 });
        e += L('M-11 -94 L-4 -96 M11 -94 L4 -96', t + 1, 0.25, { w: 2 });
      }
    }
    return g + e + '</g>';
  }

  function boySit(x, y, s, t) {
    var body = 'M-22 -44 Q-30 -8 -28 0 H28 Q30 -8 22 -44 Z';
    var head = 'M-17 -62 a17 17 0 1 0 34 0 a17 17 0 1 0 -34 0';
    var g = '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">';
    g += F(body, '#a18d6b', t + 0.5, 0.95);
    g += F(head, SKIN, t + 0.6, 1);
    g += F('M-18 -64 Q-16 -84 0 -82 Q16 -84 18 -64 Q9 -73 0 -71 Q-9 -73 -18 -64 Z', INK, t + 0.65, 1);
    g += L(body, t, 0.6);
    g += L('M-20 -40 Q-38 -12 -8 -12 M20 -40 Q38 -12 8 -12', t + 0.3, 0.5, { w: 4 });
    g += L(head, t + 0.15, 0.5);
    g += C(-6, -62, 2.2, INK, t + 0.9).replace('stroke-width="2"', 'stroke-width="1"');
    g += C(6, -62, 2.2, INK, t + 0.9).replace('stroke-width="2"', 'stroke-width="1"');
    g += L('M-11 -69 L-4 -66 M11 -69 L4 -66', t + 1, 0.25, { w: 2 });
    g += L('M-5 -52 Q0 -57 5 -52', t + 1, 0.25, { w: 2.2 });
    g += '<path class="rain" d="M-10 -58 q-4 8 0 10 q4 -2 0 -10 Z" fill="#7db4e8" stroke="' + INK + '" stroke-width="1.6" style="--d:' + (t + 1.4) + 's"/>';
    return g + '</g>';
  }

  function buddha(x, y, s, t, rays) {
    var g = '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">';
    var dome = 'M-26 0 Q-26 -32 0 -32 Q26 -32 26 0 Z';
    g += F(dome, '#f0a93a', t + 0.4, 0.95);
    g += F('M-12 -44 a12 12 0 1 0 24 0 a12 12 0 1 0 -24 0', SKIN, t + 0.5, 1);
    if (rays) {
      var i, r = '';
      for (i = 0; i < 10; i++) {
        var an = (i / 10) * Math.PI * 2, c = Math.cos(an), sn = Math.sin(an);
        r += 'M' + (c * 24).toFixed(1) + ' ' + (-44 + sn * 24).toFixed(1) + ' L' + (c * 34).toFixed(1) + ' ' + (-44 + sn * 34).toFixed(1) + ' ';
      }
      g += L(r, t + 0.9, 0.5, { w: 2.4, c: '#d99a1a' });
    }
    g += L(dome, t, 0.5, { w: 2.6 });
    g += L('M-12 -44 a12 12 0 1 0 24 0 a12 12 0 1 0 -24 0', t + 0.2, 0.4, { w: 2.4 });
    g += L('M-4 -55 Q0 -63 4 -55', t + 0.4, 0.2, { w: 2.2 });
    g += L('M-7 -45 q3 -3 6 0 M1 -45 q3 -3 6 0', t + 0.7, 0.2, { w: 1.8 });
    g += L('M-4 -38 Q0 -35 4 -38', t + 0.75, 0.2, { w: 1.8 });
    g += L('M-12 -14 Q0 -6 12 -14', t + 0.6, 0.3, { w: 2.2 });
    g += '<circle cx="0" cy="-44" r="19" fill="none" stroke="' + GOLD + '" stroke-width="2.6" class="pop" style="--d:' + (t + 0.8) + 's"/>';
    return g + '</g>';
  }

  /* ---------- scenes ---------- */

  stage.addEventListener('click', function () {
    if (!started) return;
    if (ended) { restart(); return; }
  });
  stage.addEventListener('click', function (e) {
    if (!started || ended) return;
    var r = stage.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
    if (x < 0.33) jump(cur - 1);
    else if (x > 0.67) next();
    else setPaused(!paused);
  });

  requestAnimationFrame(tick);
})();
</script>
